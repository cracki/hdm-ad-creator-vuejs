server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 256;

    # Static assets — long cache (Vite hashes filenames)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Fonts — long cache
    location ~* \.(woff2?|ttf|otf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Service worker — no cache
    location = /sw.js {
        expires off;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # manifest.json — short cache
    location = /manifest.json {
        expires 1h;
    }

    # SPA shell — must NEVER be cached: a stale index.html references hashed
    # chunks that no longer exist after a deploy (QA5: "Failed to fetch
    # dynamically imported module"). The try_files fallback below internally
    # redirects to /index.html and is therefore also answered by this
    # exact-match block, so every shell delivery gets no-store. A location
    # with its own add_header does not inherit the server-level ones, so the
    # security headers are repeated here.
    location = /index.html {
        add_header Cache-Control "no-store";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # SPA fallback — all routes serve index.html (through the no-store
    # exact-match block above)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
